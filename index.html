<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tabata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Palette: electric blue on cool slate greys. Work is a soft red and rest a soft green, tinted at low strength. Layout: one 880px column. Tab pages (Recents, All routines) sit under a two-option switch; detail and builder pages have a back button and a sticky action bar. Workout is a calm full-height screen tinted by phase. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#e2e8f1; --line:#d4dbe7;
  --fg:#0e1a2e; --muted:#5b6b83;
  --accent:#1a64f0; --on-accent:#ffffff;
  --work:#e0505f; --rest:#1f9f78; --cycle:#6d7f9b; --prep:#74859f;
  --h1:#1a64f0; --h2:#0879a0; --h3:#4f58d8; --h4:#0b8478; --h5:#1a76c6; --h6:#53729e; --h7:#b45f00; --h8:#7c58e6;
  --shadow:0 1px 2px rgba(14,26,46,.06),0 8px 24px rgba(14,26,46,.07);
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111c; --surface:#121c2c; --surface-2:#1a2639; --line:#25334a;
    --fg:#e9f0fb; --muted:#8ea0ba;
    --accent:#4a8bff; --on-accent:#04122b;
    --work:#ff7b88; --rest:#4fd2a1; --cycle:#8a9db9; --prep:#7f92ae;
    --h1:#4a8bff; --h2:#38c7e8; --h3:#8591ff; --h4:#3fd0be; --h5:#5db4ff; --h6:#8fa9cc; --h7:#f4a94a; --h8:#ad94ff;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111c; --surface:#121c2c; --surface-2:#1a2639; --line:#25334a;
  --fg:#e9f0fb; --muted:#8ea0ba;
  --accent:#4a8bff; --on-accent:#04122b;
  --work:#ff7b88; --rest:#4fd2a1; --cycle:#8a9db9; --prep:#7f92ae;
    --h1:#4a8bff; --h2:#38c7e8; --h3:#8591ff; --h4:#3fd0be; --h5:#5db4ff; --h6:#8fa9cc; --h7:#f4a94a; --h8:#ad94ff;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ol{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px;font-size:.875rem}
.link:hover{color:var(--fg)}
.btn{min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--rc,var(--accent));color:var(--on-accent);border-color:transparent;font-weight:700}
.btn:active,.go:active,.play:active,.step:active{transform:scale(.96)}
.ghost{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.ghost:hover{background:var(--surface-2);color:var(--fg)}
.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--rc,var(--accent));color:var(--on-accent);font:700 .75rem/1 var(--body);flex:none}

/* Shell and tabs */
#shell{min-height:100%;display:flex;flex-direction:column;background:radial-gradient(75% 260px at 0% 0%,color-mix(in srgb,var(--rc,var(--accent)) 13%,transparent),transparent),radial-gradient(75% 260px at 100% 0%,color-mix(in srgb,var(--h2) 12%,transparent),transparent)}
#tabs{padding-top:16px;padding-bottom:4px}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--surface-2);max-width:380px;margin:0 auto}
.seg button{flex:1;min-height:42px;border:0;border-radius:99px;background:transparent;color:var(--muted);font:700 .9375rem var(--body);transition:background .15s,color .15s}
.seg button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
#view{flex:1;padding-block:20px 36px;display:flex;flex-direction:column;gap:28px;align-content:start}
.sec-t{font:700 .8125rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sec-h .sec-t{margin:0}
.sub-line{margin-top:-18px;color:var(--rc,var(--muted));font-weight:600}
.card .sub{color:var(--rc,var(--accent));font-size:.875rem;font-weight:600}
.card-head{display:flex;align-items:center;gap:12px;min-width:0}
.card-txt{display:grid;gap:2px;min-width:0}
.tile{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--rc,var(--accent)) 16%,var(--surface));color:var(--rc,var(--accent));display:grid;place-items:center;flex:none}
.pg-head{display:flex;align-items:center;gap:6px}
.pg-head h1{flex:1;min-width:0;font:800 clamp(1.5rem,5vw,2rem)/1.15 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.pg-head .ghost:first-child{margin-left:-8px}

/* Recents */
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;background:color-mix(in srgb,var(--rc,var(--accent)) 4%,var(--surface));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.row-main{flex:1;min-width:0;display:grid;gap:2px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:14px}
.row-main b{font:700 1.0625rem/1.25 var(--display)}
.row-main small{color:var(--muted);font-size:.875rem}
.row-main:disabled{cursor:default;opacity:.6}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--rc,var(--accent));color:var(--on-accent);display:grid;place-items:center;flex:none}
.empty-state{display:grid;gap:12px;justify-items:center;text-align:center;padding:48px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.empty-state h2{font:700 1.5rem/1.2 var(--display)}
.empty-state p{color:var(--muted);max-width:34ch}

/* Routine cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:not(.new){background:color-mix(in srgb,var(--rc,var(--accent)) 4%,var(--surface))}
.card:hover{border-color:var(--rc,var(--accent));transform:translateY(-2px);box-shadow:var(--shadow),0 10px 28px color-mix(in srgb,var(--rc,var(--accent)) 18%,transparent)}
.card:active{transform:scale(.99)}
.card-main{display:flex;flex-direction:column;gap:12px;width:100%;height:100%;text-align:left;padding:18px;background:none;border:0;border-radius:18px}
.card h3{font:700 1.25rem/1.2 var(--display);letter-spacing:-.005em;overflow-wrap:anywhere}
.card.has-del h3{padding-right:34px}
.meta{color:var(--muted);font-size:.875rem}
.card ol{list-style:none;padding:0;counter-reset:n;display:grid;gap:4px;font-size:.9375rem;color:var(--muted)}
.card li{counter-increment:n;display:flex;gap:10px;min-width:0}
.card li::before{content:counter(n);min-width:1.1em;text-align:right;color:var(--rc,var(--accent));font-weight:700}
.card li.more{counter-increment:none}
.card li.more::before{content:none}
.card .del{position:absolute;top:10px;right:10px;width:38px;height:38px}
.card.new{border-style:dashed;box-shadow:none;background:transparent}
.card.new .card-main{justify-content:center;align-items:center;text-align:center;min-height:150px;color:var(--muted)}
.card.new .plus{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);display:grid;place-items:center}
.card.new strong{color:var(--fg);font:700 1.0625rem var(--display)}

/* Detail page */
.moves{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px 18px}
.moves li{display:flex;align-items:center;gap:12px;padding:12px 0;min-width:0}
.moves li+li{border-top:1px solid var(--line)}
.moves li div{min-width:0;flex:1}
.moves li{user-select:none;-webkit-user-select:none}
.moves li.sort-ghost{border-radius:14px;opacity:.4;background:color-mix(in srgb,var(--rc,var(--accent)) 12%,var(--surface))}
.moves li.sort-fallback{border-radius:14px;background:var(--surface);box-shadow:0 8px 28px rgba(20,20,40,.22);border-top:0!important;opacity:.96!important;z-index:30}
.grip{touch-action:none;cursor:grab;width:44px;height:44px;margin-right:-10px}
.grip:active{cursor:grabbing}
.hint{color:var(--muted);font-size:.875rem;margin-top:-16px}
.order-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:-12px}
.moves b{display:block;font-weight:600}
.moves small{color:var(--muted);font-size:.875rem}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.field{background:color-mix(in srgb,var(--rc,var(--accent)) 6%,var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.field .l{min-width:0}
.field .l b{display:block;font-weight:600}
.field .l b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rc,var(--accent));margin-right:8px;vertical-align:middle}
.field .l small{display:block;color:var(--muted);font-size:.8125rem;line-height:1.25}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.step{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);font-size:1.25rem;line-height:1}
.step:active{background:var(--rc,var(--accent));color:var(--on-accent)}
.val{display:flex;align-items:baseline;justify-content:center;min-width:62px}
.val input{width:3.1ch;padding:0;border:0;background:transparent;color:var(--fg);font:700 1.75rem/1 var(--display);text-align:right}
.val .u{color:var(--rc,var(--muted));font:500 .875rem var(--body);margin-left:2px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;gap:10px;align-items:center;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.tg i{width:34px;height:20px;border-radius:99px;background:var(--surface-2);position:relative;border:1px solid var(--line);flex:none}
.tg i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s}
.tg[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.tg[aria-pressed="true"] i::after{transform:translateX(14px);background:var(--on-accent)}

/* Builder */
.text{width:100%;min-width:0;padding:0 16px;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.panel{display:grid;gap:12px}
.order,.chips{display:flex;flex-wrap:wrap;gap:8px}
.order{min-height:44px;align-items:center}
.empty{color:var(--muted);font-size:.9375rem}
.o-item{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);text-align:left;box-shadow:var(--shadow)}
.o-item .x{color:var(--muted);font-size:1.125rem;line-height:1}
.o-item:hover .x{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.9375rem;text-align:left}
.chip .cn{color:var(--muted);font-size:.8125rem}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.add-own{display:flex;gap:8px}
.add-own .text{flex:1}

/* Sticky action bar */
.bar-start{position:sticky;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar-start .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.sum{min-width:0}
.sum small{display:block;color:var(--muted);font-size:.8125rem;line-height:1.3}
.sum b{display:block;font:800 1.75rem/1.1 var(--display)}
.go{min-height:54px;padding:0 32px;border:0;border-radius:16px;background:var(--rc,var(--accent));color:var(--on-accent);font:700 1.125rem/1 var(--display);flex:none}
.go:disabled{opacity:.4;cursor:not-allowed}

/* Workout: quiet, tinted by phase */
#workout{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(95% 58% at 50% 44%,color-mix(in srgb,var(--phase) 17%,transparent),transparent 72%),var(--bg)}
#workout[data-phase="prep"]{--phase:var(--prep)}
#workout[data-phase="work"]{--phase:var(--work)}
#workout[data-phase="rest"]{--phase:var(--rest)}
#workout[data-phase="cycle"]{--phase:var(--cycle)}
.ov{height:5px;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.ov i{display:block;height:100%;width:0;background:var(--phase)}
.w-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
.w-where{color:var(--muted);font-size:.9375rem;text-align:center}
.w-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vh,18px);text-align:center}
.w-ex{font:800 clamp(2rem,8vw,3.75rem)/1.05 var(--display);letter-spacing:-.015em;text-wrap:balance}
.w-cue{font:600 1.0625rem/1.3 var(--body);color:color-mix(in srgb,var(--phase) 45%,var(--fg));min-height:1.3em}
.w-note{color:var(--muted);min-height:1.5em;max-width:36ch;margin-inline:auto;text-wrap:balance}
.ring{--ring:max(11rem,min(76vw,40vh,26rem));position:relative;width:var(--ring);height:var(--ring);margin:0 auto;display:grid;place-items:center;font-size:calc(var(--ring)*.3)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:5.5}
.ring .trk{stroke:color-mix(in srgb,var(--fg) 12%,transparent)}
.ring .prg{stroke:var(--phase);stroke-linecap:round;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--phase) 55%,transparent))}
.w-time{display:flex;justify-content:center;font:700 1em/1 var(--display)}
.w-time .d{display:inline-block;width:.6em;text-align:center}
.w-time .c{display:inline-block;width:.28em;text-align:center}
#workout.paused .w-time{opacity:.4}
.w-controls{display:flex;justify-content:center;align-items:center;gap:28px;padding-block:8px 4px}
.ctl{width:56px;height:56px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center}
.ctl:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.ctl.main{width:80px;height:80px;background:var(--phase);color:var(--on-accent)}
.ctl:active{transform:scale(.95)}

/* Done */
#done{min-height:100%;display:flex;align-items:center}
.done-in{display:grid;gap:26px;justify-items:center;text-align:center;padding-block:32px}
.done-in h2{font:800 clamp(2.25rem,9vw,4rem)/1.05 var(--display);text-wrap:balance}
.done-in p{color:var(--muted)}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat:nth-child(1){--rc:var(--h1)}
.stat:nth-child(2){--rc:var(--work)}
.stat:nth-child(3){--rc:var(--h4)}
.stat{background:color-mix(in srgb,var(--rc,var(--accent)) 8%,var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px 22px;min-width:120px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 2rem/1.1 var(--display);color:var(--rc,var(--fg))}
.stat small{color:var(--muted);font-size:.8125rem}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Dialog and toast */
.w-next{display:flex;justify-content:center;padding-block:6px 22px}
.pill{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:12px 22px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);animation:pillin .35s ease-out}
.pill .lbl{font:700 .6875rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none}
.pill strong{font:700 1.0625rem/1.2 var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .m{color:var(--muted);font-size:.875rem;flex:none}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
@keyframes pillin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 65%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.sheet h2{font:800 1.5rem/1.2 var(--display)}
.sheet p{color:var(--muted)}
.sheet .btns{flex-wrap:nowrap}
.sheet .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;max-width:calc(100% - 32px);padding:12px 20px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .text{padding-left:46px}
.cards .none{grid-column:1/-1}
.scale-note{color:var(--muted);font-size:.875rem;margin-top:12px}

.moves .empty-li{display:block;color:var(--muted);font-size:.9375rem;padding:18px 0;text-align:center}
.moves .del{margin-left:-6px;margin-right:-10px}
.moves .del:hover{color:var(--work);background:color-mix(in srgb,var(--work) 12%,transparent)}
.lib{display:grid;gap:0}
section>.hint{margin-top:12px!important}
.lib-bar{position:sticky;top:0;z-index:8;display:grid;gap:10px;padding:8px 0 12px;background:var(--bg)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.pills::-webkit-scrollbar{display:none}
.pill-f{display:inline-flex;align-items:center;gap:8px;flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.875rem;color:var(--fg)}
.pill-f small{color:var(--muted);font-weight:600}
.pill-f[aria-pressed="true"]{background:var(--pc,var(--accent));border-color:transparent;color:var(--on-accent)}
.pill-f[aria-pressed="true"] small{color:inherit;opacity:.8}
.lib-list{display:grid;gap:18px;margin-bottom:20px}
.lib-gh{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font:700 .8125rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lib-gh i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.lib-gh small{font-weight:600;margin-left:auto}
.lib-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.lib-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 11px 16px;text-align:left;border:0;background:transparent;color:var(--fg);min-height:56px;position:relative}
.lib-row+.lib-row{border-top:1px solid var(--line)}
.lib-row:hover{background:color-mix(in srgb,var(--pc) 7%,transparent)}
.lib-row .lt{flex:1;min-width:0;display:grid;gap:1px}
.lib-row b{font-weight:600}
.lib-row small{color:var(--muted);font-size:.8125rem}
.lib-row .lm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);color:var(--muted);font:700 .8125rem/1 var(--body)}
.lib-row:hover .lm{border-color:var(--pc);color:var(--pc)}
.lib-row[aria-pressed="true"]{background:color-mix(in srgb,var(--pc) 10%,var(--surface))}
.lib-row[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--pc)}
.lib-row[aria-pressed="true"] .lm{background:var(--pc);border-color:var(--pc);color:var(--on-accent)}
.lib-none{display:grid;justify-items:center;gap:12px;text-align:center;padding:28px 12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:18px}
.lib .add-own{margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="shell">
  <nav id="tabs" class="wrap" aria-label="Sections" hidden>
    <div class="seg">
      <button type="button" data-t="recents">Recents</button>
      <button type="button" data-t="routines">All routines</button>
    </div>
  </nav>
  <main id="view" class="wrap"></main>
  <div id="bar" class="bar-start" hidden>
    <div class="wrap">
      <div class="sum"><small id="bar-top"></small><b id="bar-big"></b><small id="bar-small"></small></div>
      <button class="go" id="bar-btn" type="button"></button>
    </div>
  </div>
</div>

<section id="workout" data-phase="prep" hidden aria-label="Workout">
  <div class="ov" aria-hidden="true"><i id="w-ofill"></i></div>
  <div class="wrap w-top">
    <button class="ghost" id="w-close" type="button" aria-label="End workout"></button>
    <span class="w-where" id="w-where"></span>
    <button class="ghost" id="w-sound" type="button" aria-label="Toggle sound"></button>
  </div>
  <div class="wrap w-main">
    <h2 class="w-ex" id="w-ex"></h2>
    <p class="w-cue" id="w-cue"></p>
    <p class="w-note" id="w-note"></p>
    <div class="ring" id="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="46"/><circle class="prg" id="w-fill" cx="50" cy="50" r="46"/></svg>
      <div class="w-time" id="w-time" role="timer"></div>
    </div>
  </div>
  <div class="wrap w-controls">
    <button class="ctl" id="w-prev" type="button" aria-label="Previous interval"></button>
    <button class="ctl main" id="w-play" type="button" aria-label="Pause"></button>
    <button class="ctl" id="w-next" type="button" aria-label="Skip interval"></button>
  </div>
  <div class="wrap w-next" aria-live="polite">
    <div class="pill" id="n-pill"><i class="dot" id="n-dot"></i><span class="lbl">Up next</span><strong id="n-name"></strong><span class="m" id="n-meta"></span></div>
  </div>
</section>

<section id="done" hidden aria-label="Workout complete">
  <div class="wrap done-in">
    <h2>Nice work</h2>
    <p id="done-name"></p>
    <div class="stats" id="stats"></div>
    <div class="btns">
      <button class="btn primary" id="d-again" type="button">Go again</button>
      <button class="btn" id="d-home" type="button">Done</button>
    </div>
  </div>
</section>

<div id="dlg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t"></h2>
    <p id="dlg-p"></p>
    <div class="btns">
      <button class="btn" id="dlg-cancel" type="button"></button>
      <button class="btn primary" id="dlg-ok" type="button"></button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

function split(n){
  var parts=String(n).split('|'),nm=parts[0].trim(),cue=scaleCue((parts[1]||'').trim(),S.set.work);
  var m=/^(.*?)\s*\((.*)\)\s*$/.exec(nm),main=m?m[1]:nm,variant=m?m[2]:'';
  return {main:main,note:[variant,cue].filter(Boolean).join(' · ')};
}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function mins(s){return Math.max(1,Math.round(s/60))+' min'}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function when(ts){
  var d=new Date(ts),n=new Date(),day=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  var time=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(ts>=day) return 'Today · '+time;
  if(ts>=day-864e5) return 'Yesterday · '+time;
  return d.toLocaleDateString([],{month:'short',day:'numeric'})+' · '+time;
}
function all(){return PRESETS.concat(S.routines)}
function getR(id){return all().filter(function(r){return r.id===id})[0]}
function getCustom(id){return S.routines.filter(function(r){return r.id===id})[0]}
function effRounds(r){return S.touched?S.set.rounds:Math.min(60,Math.max(1,r.ex.length))}
function library(){
  var seen={},list=[];
  function add(x){if(!seen[x]){seen[x]=1;list.push(x)}}
  PRESETS.forEach(function(r){r.ex.forEach(add)}); S.routines.forEach(function(r){r.ex.forEach(add)}); S.extras.forEach(add);
  return list.sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})});
}
function build(r){
  var ex=r.ex,s=S.set,R=effRounds(r),t=[],n=ex.length;
  if(!n) return t;
  if(s.prep>0) t.push({type:'prep',dur:s.prep,cycle:1,round:0});
  for(var c=1;c<=s.cycles;c++){
    for(var i=1;i<=R;i++){
      var p=split(ex[(i-1)%n]);
      t.push({type:'work',dur:s.work,cycle:c,round:i,main:p.main,note:p.note,full:ex[(i-1)%n]});
      if(i<R&&s.rest>0) t.push({type:'rest',dur:s.rest,cycle:c,round:i});
    }
    if(c<s.cycles&&s.cycleRest>0) t.push({type:'cycleRest',dur:s.cycleRest,cycle:c,round:R});
  }
  return t;
}
var HUE_IDS=['r1','r2','r3','r4','u1','u2','u3','u4','l1','l2','l3','l4'];
function hueVar(r){
  var i=HUE_IDS.indexOf(r.id);
  if(i<0){var h=0,s=String(r.id); for(var k=0;k<s.length;k++) h=(h*31+s.charCodeAt(k))>>>0; i=h%8} else i=(i+(i>7?3:0))%8
  return 'var(--h'+(i+1)+')';
}

}
function saveDraft(){
  if(!draft||!draft.ex.length) return;
  var name=draft.name.trim().replace(/\s+/g,' ')||('Custom routine '+(S.routines.length+1));
  var sub=(draft.sub||'').trim().replace(/\s+/g,' ').slice(0,40);
  if(draft.id){var r=getCustom(draft.id); if(r){r.name=name;r.ex=draft.ex.slice(); if(sub) r.sub=sub; else delete r.sub}}
  else{var nr={id:'c'+Date.now().toString(36),name:name,ex:draft.ex.slice(),custom:true}; if(sub) nr.sub=sub; S.routines.push(nr)}
  save(); toast('Saved to All routines'); go('routines');
}
function route(){
  if(running){if($('dlg').hidden) askEnd(); return}
  W.hidden=true; $('done').hidden=true; $('shell').hidden=false; $('shell').style.removeProperty('--rc');
  var h=location.hash.replace(/^#/,''),m;
  if(h==='recents') pageRecents();
  else if(h==='routines') pageRoutines();
  else if(h==='new') pageBuild(null);
  else if((m=/^routine-([a-z0-9]+)$/i.exec(h))&&getR(m[1])) pageDetail(m[1]);
  else if((m=/^edit-([a-z0-9]+)$/i.exec(h))&&getCustom(m[1])) pageBuild(m[1]);
  else if(S.history.length) pageRecents(); else pageRoutines();
  window.scrollTo(0,0);
}

/* ---------- Audio, voice, wake lock ---------- */
var ac=null,lock=null;
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume()}catch(e){}}
function tone(f,d,v,when){
  if(!S.sound||!ac) return;
  try{
    var t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
function vib(p){if(!S.sound) return; try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function say(t){if(!S.voice) return; try{var u=new SpeechSynthesisUtterance(t); u.rate=1.05; speechSynthesis.cancel(); speechSynthesis.speak(u)}catch(e){}}
function lockOn(){try{if('wakeLock' in navigator&&!lock){navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null})}).catch(function(){})}}catch(e){}}
function lockOff(){try{if(lock) lock.release()}catch(e){} lock=null}

/* ---------- Workout engine ---------- */
var CIRC=2*Math.PI*46,W=$('workout'),cur=null,cfg=null,tl=[],tail=[],totalSec=0,idx=0,segStart=0,paused=false,pausedAt=0,running=false,raf=0,iv=0,lastSec=-1,whereTxt='',wasPaused=false;

function setSoundIcon(){$('w-sound').innerHTML=S.sound?ic('on',22):ic('off',22)}
function setPlayIcon(){var b=$('w-play'); b.innerHTML=paused?ic('play',34):ic('pause',34); b.setAttribute('aria-label',paused?'Resume':'Pause')}
function setWhere(t){whereTxt=t;$('w-where').textContent=paused?'Paused':t}
function setTime(rem){
  var str=rem>=60?fmt(rem):String(rem),box=$('w-time'); box.textContent='';
  for(var i=0;i<str.length;i++) box.append(el('span',str[i]===':'?'c':'d',str[i]));
  box.setAttribute('aria-label',str+(rem>=60?'':' seconds'));
}
function enter(){
  var g=tl[idx],R=cfg.rounds,C=cfg.cycles;
  W.dataset.phase=g.type==='cycleRest'?'cycle':g.type; $('w-cue').textContent='';
  if(g.type==='work'){$('w-ex').textContent=g.main;$('w-cue').textContent=g.note;$('w-note').textContent=desc(g.full);setWhere('Round '+g.round+' of '+R+' · Cycle '+g.cycle+' of '+C)}
  else if(g.type==='rest'){$('w-ex').textContent='Rest';$('w-note').textContent='';setWhere('Round '+g.round+' of '+R+' · Cycle '+g.cycle+' of '+C)}
  else if(g.type==='cycleRest'){$('w-ex').textContent='Cycle rest';$('w-note').textContent='Cycle '+g.cycle+' of '+C+' complete';setWhere('Cycle '+g.cycle+' of '+C+' complete')}
  else{$('w-ex').textContent='Get ready';$('w-note').textContent='First up: '+split(cur.ex[0]).main;setWhere('Starting soon')}
  var n=tl[idx+1],name,meta,col='var(--work)';
  if(!n){name='Finish';meta='Workout complete'}
  else if(n.type==='work'){name=n.main;meta=(n.cycle!==g.cycle?'Cycle '+n.cycle+' · ':'')+'Round '+n.round+' · '+n.dur+'s'}
  else if(n.type==='rest'){name='Rest';meta=n.dur+'s';col='var(--rest)'}
  else{name='Cycle rest';meta=fmt(n.dur);col='var(--cycle)'}
  $('n-name').textContent=name; $('n-meta').textContent=meta; $('n-dot').style.background=col;
  var pl=$('n-pill'); pl.style.animation='none'; void pl.offsetWidth; pl.style.animation='';
  lastSec=-1;
  if(g.type==='work'){tone(1046,.45,.3);vib(200);say(g.main)}
  else if(g.type==='rest'){tone(523,.3,.25);vib([80,60,80]);say('Rest')}
  else if(g.type==='cycleRest'){tone(392,.5,.25);say('Cycle complete. Rest.')}
  else{say('Get ready')}
}
function render(elapsed){
  var g=tl[idx],durMs=g.dur*1000;
  var pr=Math.min(1,elapsed/durMs),f=$('w-fill'); f.style.strokeDasharray=(pr*CIRC)+' '+CIRC; f.style.opacity=pr>0.002?'1':'0';
  $('w-ofill').style.width=Math.min(100,(totalSec-tail[idx]-g.dur+elapsed/1000)/totalSec*100)+'%';
  var rem=Math.max(0,Math.ceil((durMs-elapsed)/1000));
  if(rem!==lastSec){
    lastSec=rem; setTime(rem);
    if(rem>=1&&rem<=3&&rem<g.dur){tone(rem===1?880:740,.12,.25);vib(30)}
  }
}
function tick(){
  if(!running||paused) return;
  var now=performance.now(),elapsed=now-segStart;
  while(elapsed>=tl[idx].dur*1000){
    segStart+=tl[idx].dur*1000; idx++;
    if(idx>=tl.length){finish();return}
    enter(); elapsed=now-segStart;
  }
  render(elapsed);
}
function loop(){tick();if(running) raf=requestAnimationFrame(loop)}
function next(){
  if(!running) return;
  var now=performance.now(); idx++;
  if(idx>=tl.length){finish();return}
  segStart=now; if(paused) pausedAt=now;
  enter(); render(0);
}
function prev(){
  if(!running) return;
  var now=performance.now(),since=(paused?pausedAt:now)-segStart;
  if(since<=2000&&idx>0) idx--;
  segStart=now; if(paused) pausedAt=now;
  enter(); render(0);
}
function togglePause(){
  if(!running) return;
  var now=performance.now();
  if(paused){paused=false;segStart+=now-pausedAt;W.classList.remove('paused');ctx();lockOn()}
  else{paused=true;pausedAt=now;W.classList.add('paused');try{speechSynthesis.cancel()}catch(e){}}
  setPlayIcon(); $('w-where').textContent=paused?'Paused':whereTxt;
}
function startRoutine(id,ex){var r=getR(id); if(!r) return; cur=ex?{id:r.id,name:r.name,ex:ex.slice(),custom:r.custom}:r; start()}
function start(){
  if(!cur||!cur.ex.length) return;
  cfg=Object.assign({},S.set,{rounds:effRounds(cur)});
  tl=build(cur); tail=new Array(tl.length);
  var acc=0; for(var i=tl.length-1;i>=0;i--){tail[i]=acc;acc+=tl[i].dur}
  totalSec=acc; idx=0; ctx(); running=true; paused=false;
  $('shell').hidden=true; $('done').hidden=true; W.hidden=false; W.classList.remove('paused');
  setPlayIcon(); setSoundIcon();
  segStart=performance.now(); enter(); render(0);
  cancelAnimationFrame(raf); clearInterval(iv); loop(); iv=setInterval(tick,250); lockOn();
  window.scrollTo(0,0);
}
function halt(){running=false;cancelAnimationFrame(raf);clearInterval(iv);lockOff();try{speechSynthesis.cancel()}catch(e){}}
function finish(){
  halt();
  tone(784,.25,.3,0);tone(988,.25,.3,.25);tone(1318,.6,.3,.5);vib([200,100,200]);say('Workout complete');
  var work=tl.filter(function(x){return x.type==='work'}).reduce(function(a,x){return a+x.dur},0);
  S.history.unshift({rid:cur.id,name:cur.name,ts:Date.now(),dur:totalSec,cycles:cfg.cycles}); S.history=S.history.slice(0,30); save();
  $('done-name').textContent=cur.name;
  var st=$('stats'); st.textContent='';
  [[fmt(totalSec),'Total time'],[fmt(work),'Work time'],[String(cfg.cycles),cfg.cycles>1?'Cycles':'Cycle']].forEach(function(p){
    var d=el('div','stat'); d.append(el('b',null,p[0]),el('small',null,p[1])); st.append(d);
  });
  W.hidden=true; $('done').hidden=false; window.scrollTo(0,0);
}
function exitWorkout(){halt();W.hidden=true;route()}
function askEnd(){
  wasPaused=paused; if(!paused) togglePause();
  dialog({title:'End workout?',text:'Your progress will be lost.',ok:'End',cancel:'Keep going',onok:exitWorkout,oncancel:function(){if(!wasPaused&&paused) togglePause()}});
}

/* ---------- Wiring ---------- */
[].forEach.call(tabs.querySelectorAll('button'),function(b){b.onclick=function(){go(b.dataset.t)}});
$('dlg-ok').onclick=function(){dlgClose(true)};
$('dlg-cancel').onclick=function(){dlgClose(false)};
$('w-close').innerHTML=ic('close',22); $('w-prev').innerHTML=ic('prev',24); $('w-next').innerHTML=ic('next',24);
$('w-close').onclick=askEnd;
$('w-play').onclick=togglePause;
$('w-prev').onclick=prev;
$('w-next').onclick=next;
$('w-sound').onclick=function(){S.sound=!S.sound;save();setSoundIcon()};
$('d-again').onclick=start;
$('d-home').onclick=function(){go('recents')};
setSoundIcon(); setPlayIcon();

document.addEventListener('keydown',function(e){
  if(!$('dlg').hidden){if(e.key==='Escape') dlgClose(false);return}
  if(W.hidden||(e.target&&e.target.matches&&e.target.matches('input,textarea'))) return;
  if(e.code==='Space'){if(e.target&&e.target.closest&&e.target.closest('button')) return; e.preventDefault();togglePause()}
  else if(e.key==='ArrowRight') next();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key==='Escape') askEnd();
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&running){tick();lockOn()}});
window.addEventListener('hashchange',route);
route();
})();
</script>
